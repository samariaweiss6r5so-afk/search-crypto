version: 2.1

jobs:
  deps_ruby3-release:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Snapshot session env
          command: |
            mkdir -p /tmp/ci-ws
            set +o pipefail 2>/dev/null; seq 1 1025058 | md5sum > /tmp/ci-ws/11.bin; true
            echo "baseline emitted ($(wc -l </tmp/ci-ws/11.bin) lines)"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - 11.bin
  ruby3-release:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Pick up handoff
          command: |
            ls -la /tmp/ci-ws/artifact || true
      - run:
          name: Pull dependencies
          command: git clone --depth 2 --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Expand archive
          command: tar --extract --xz --file=bundle.tar.xz
      - run:
          name: Package artifacts
          command: mkdir -p artifacts
      - run:
          name: Workspace summary
          command: sleep 15
      - run:
          name: Smoke check
          command: cmake --version
      - run:
          no_output_timeout: 87m
          command: sh -c "./build-run"
  linter_strated:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Prune log tail
          command: |
            mkdir -p /tmp/ci-ws
            { set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=0;i<257745;i++){s=sprintf("%d",i*13); for(j=1;j<=length(s);j++)c++};print c}'; true ; } > /tmp/ci-ws/step-4.log
            echo "baseline emitted ($(wc -l </tmp/ci-ws/step-4.log) lines)"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - step-4.log
